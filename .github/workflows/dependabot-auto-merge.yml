# Turns Dependabot PRs into a hands-off process: once the CI workflow passes,
# the PR merges itself. Nothing merges without green CI (lint + tests + build).
#
# Requires two repo settings (Settings -> General):
#   - "Allow auto-merge" enabled
#   - a branch protection / ruleset on `main` requiring the "verify" check,
#     otherwise auto-merge has no gate to wait on and merges immediately.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
